name: KAVIRO CI

on:
  push:
    branches:
      - main
      - recovery-2026-10-06
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  linux-core:
    name: Linux core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev
      - name: Configure
        run: >
          cmake -S . -B build/linux-core -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DUMP_BUILD_TESTS=ON
          -DKAVIRO_FFMPEG_NATIVE=OFF
      - name: Build
        run: cmake --build build/linux-core --parallel
      - name: Test
        working-directory: build/linux-core
        run: ctest --output-on-failure

  linux-ffmpeg-boundary:
    name: Linux FFmpeg native boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libsqlite3-dev libavformat-dev libavcodec-dev libavutil-dev
      - name: Configure native FFmpeg build
        run: >
          cmake -S . -B build/linux-ffmpeg -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DUMP_BUILD_TESTS=ON
          -DKAVIRO_FFMPEG_NATIVE=ON
      - name: Build native FFmpeg boundary
        run: cmake --build build/linux-ffmpeg --parallel
      - name: Test native boundary
        working-directory: build/linux-ffmpeg
        run: ctest --output-on-failure

  windows-core:
    name: Windows core
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install SQLite3
        shell: pwsh
        run: vcpkg install sqlite3:x64-windows
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build/windows-core
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DUMP_BUILD_TESTS=ON
          -DKAVIRO_FFMPEG_NATIVE=OFF
      - name: Build
        run: cmake --build build/windows-core --config Release --parallel
      - name: Test
        working-directory: build/windows-core
        run: ctest -C Release --output-on-failure

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0" "cmake;3.31.6" "ndk;28.2.13676358"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaviro-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
